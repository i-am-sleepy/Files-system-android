name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source.zip (only if you uploaded one)
        run: |
          if [ -f source.zip ]; then
            unzip -o -q source.zip
            rm -f source.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack project files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          if [ ! -f app/build.gradle ]; then
            echo "::error::Project files not found. Upload source.zip to the main page of this repository first."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk OpenFiles.apk
          gh release create "build-${{ github.run_number }}" OpenFiles.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build ${{ github.run_number }}" \
            --notes "Tap OpenFiles.apk below to download it, then open it to install."
